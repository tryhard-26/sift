[package]
name = "sift-disk"
version = "0.1.1"
edition = "2021"
description = "Fast interactive disk usage explorer with a treemap and cleanup recommendations"
license = "Unlicense"
repository = "https://github.com/tryhard-26/sift"
readme = "README.md"
keywords = ["disk", "du", "tui", "treemap", "cleanup"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["/.github"]

[[bin]]
name = "sift"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[profile.release]
lto = true
codegen-units = 1
strip = true
